name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {elixir: "1.18", otp: "27"}
          - {elixir: "1.20", otp: "28"}
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/blackbox_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: {elixir-version: "${{ matrix.elixir }}", otp-version: "${{ matrix.otp }}"}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix compile --no-optional-deps --warnings-as-errors --force
      - name: the package never names its first host
        run: "! grep -rnE 'Charta|Hologram' lib"
      - run: mix test
      - run: mix test
      - run: mix test
      - name: the package ships only lib, mix.exs, README and LICENSE
        run: |
          mix hex.build --unpack -o pkg
          test -z "$(cd pkg && ls | grep -vxE 'lib|mix.exs|README.md|LICENSE|hex_metadata.config')"
